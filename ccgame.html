<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fun, fast-paced web game..." />
    <meta
      name="keywords"
      content="Country Counter, game, countries, geography"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="stylesheet" href="styles/ccgame.css" />
    <title>Country Counter</title>
  </head>

  <body>
    <div id="game-container">
      <h1>Country Counter</h1>
      <div id="high-score">High Score: 0</div>
      <div id="timer">Time left: 120 seconds</div>
      <input
        type="text"
        id="country-input"
        placeholder="Enter a country name..."
      />
      <button id="submit">Submit</button>
      <button id="play-again">Play Again</button>
      <div id="results"></div>
    </div>
    <script src="js/ccgame.js"></script>
  </body>
</html>
